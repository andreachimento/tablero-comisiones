<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Comisiones - Coderhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --accent: #FF5A1F;
    --accent-dark: #D8430E;
    --accent-light: #FFF0E8;
    --ink: #17181C;
    --ink-soft: #5b5f6d;
    --line: #e6e7ec;
    --line-soft: #f0f1f4;
    --bg: #f7f7f8;
    --green: #0e9f6e;
    --green-bg: #e5f8f0;
    --amber: #C48A00;
    --amber-bg: #FFF3D6;
    --red: #d92d20;
    --red-bg: #fde8e6;
    --pink: #db2777;
    --pink-bg: #fce7f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 13px; -webkit-font-smoothing: antialiased; }

  .header { background: #ffffff; color: var(--ink); padding: 18px 26px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-bottom: 3px solid var(--accent); }
  .header .titlewrap { display: flex; align-items: center; gap: 12px; }
  .header .logo-wordmark { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); text-transform: uppercase; }
  .header .logo-wordmark span { color: var(--accent); }
  .header h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink-soft); }
  .header p { font-size: 11.5px; opacity: 0.7; margin-top: 3px; font-weight: 500; color: var(--ink-soft); }
  .refresh-btn { background: var(--accent); border: none; color: white; border-radius: 999px; padding: 9px 18px; font-size: 12.5px; cursor: pointer; font-weight: 700; transition: all .15s; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .refresh-btn:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(255,90,31,0.35); }
  .refresh-btn:disabled { opacity: .6; cursor: default; transform: none; }
  .last-update { font-size: 10.5px; opacity: 0.65; text-align: right; margin-top: 5px; font-weight: 500; color: var(--ink-soft); }

  .stats { display: flex; gap: 10px; padding: 16px 26px; background: transparent; flex-wrap: wrap; }
  .stat-card { background: white; border-radius: 12px; padding: 12px 18px; min-width: 128px; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(20,20,43,0.04); }
  .stat-card .num { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .stat-card .lbl { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; font-weight: 600; }
  .stat-card.green .num { color: var(--green); }
  .stat-card.orange .num { color: var(--amber); }
  .stat-card.red .num { color: var(--red); }
  .stat-card.accent .num { color: var(--accent); }

  .controls { margin: 0 26px 14px; padding: 12px 16px; background: white; border-radius: 12px; border: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; box-shadow: 0 1px 2px rgba(20,20,43,0.04); }
  .controls input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; width: 240px; outline: none; transition: all .15s; }
  .controls input[type=date] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; outline: none; color: var(--ink); }
  .controls input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px var(--accent-light); }
  .filter-label { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; white-space: nowrap; }
  .quickbtn { border: 1px solid var(--line); background: white; border-radius: 8px; padding: 7px 13px; font-size: 11.5px; cursor: pointer; color: var(--ink-soft); font-weight: 600; transition: all .12s; }
  .quickbtn:hover { border-color: var(--accent); color: var(--accent); }
  .quickbtn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .result-count { font-size: 11.5px; color: var(--ink-soft); margin-left: auto; white-space: nowrap; font-weight: 600; }
  .clear-btn { border: 1px solid var(--line); background: white; border-radius: 8px; padding: 7px 13px; font-size: 11.5px; cursor: pointer; color: var(--red); font-weight: 600; }
  .clear-btn:hover { background: var(--red-bg); border-color: var(--red); }

  .table-wrap { margin: 0 26px 26px; overflow: auto; max-height: calc(100vh - 268px); border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(20,20,43,0.05); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; }
  thead th { background: #fafafc; color: var(--ink); padding: 0; font-size: 11px; font-weight: 700; text-align: left; white-space: nowrap; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); }
  .th-inner { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; gap: 6px; }
  .th-label { cursor: pointer; user-select: none; flex: 1; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .4px; font-size: 10.5px; }
  .th-label:hover { color: var(--accent); }
  .filter-icon { cursor: pointer; font-size: 9px; padding: 3px 5px; border-radius: 4px; color: #b7b9c4; }
  .filter-icon:hover { background: var(--line-soft); color: var(--ink-soft); }
  .filter-icon.active { color: white; background: var(--accent); }
  th.sorted-asc .th-label, th.sorted-desc .th-label { color: var(--accent); }
  th.sorted-asc .th-label::after { content: ' \25B2'; font-size: 8px; }
  th.sorted-desc .th-label::after { content: ' \25BC'; font-size: 8px; }

  tbody tr { border-bottom: 1px solid var(--line-soft); transition: background .1s; }
  tbody tr:hover { background: var(--accent-light) !important; }
  td { padding: 9px 12px; vertical-align: middle; white-space: nowrap; font-size: 12.5px; color: var(--ink); }
  .commission { font-weight: 700; color: var(--accent-dark); font-variant-numeric: tabular-nums; }
  .course-name { font-weight: 600; color: var(--ink); white-space: normal; min-width: 180px; max-width: 260px; }
  .badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .2px; }
  .tag-si { background: var(--amber-bg); color: var(--amber); }
  .tag-no { color: #b7b9c4; font-size: 11.5px; font-weight: 500; }
  .tag-soldout-si { background: var(--pink-bg); color: var(--pink); }
  .tag-soldout-no { color: #b7b9c4; font-size: 11.5px; font-weight: 500; }
  .prof-empty { color: var(--red); font-size: 11.5px; font-style: italic; opacity: .85; }
  .estudiantes { text-align: center; font-weight: 700; border-radius: 999px; padding: 4px 11px; font-variant-numeric: tabular-nums; display: inline-block; min-width: 34px; }
  .modalidad-tag { background: var(--green-bg); color: var(--green); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
  .pais-tag { color: var(--ink-soft); font-weight: 600; font-size: 11.5px; }

  .filter-dropdown { position: fixed; background: white; border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(20,20,43,0.18); border-radius: 10px; z-index: 100; min-width: 230px; max-height: 320px; display: flex; flex-direction: column; overflow: hidden; }
  .filter-dropdown .fd-search { padding: 10px; border-bottom: 1px solid var(--line-soft); }
  .filter-dropdown .fd-search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; outline: none; }
  .filter-dropdown .fd-search input:focus { border-color: var(--accent); }
  .filter-dropdown .fd-actions { display: flex; justify-content: space-between; padding: 7px 10px; border-bottom: 1px solid var(--line-soft); font-size: 11px; }
  .filter-dropdown .fd-actions a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
  .filter-dropdown .fd-list { overflow-y: auto; padding: 4px 0; }
  .filter-dropdown .fd-item { display: flex; align-items: center; gap: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .filter-dropdown .fd-item:hover { background: var(--line-soft); }
  .filter-dropdown .fd-footer { padding: 8px 10px; border-top: 1px solid var(--line-soft); display: flex; justify-content: flex-end; gap: 6px; }
  .fd-btn { border: 1px solid var(--line); background: white; border-radius: 6px; padding: 5px 12px; font-size: 11px; cursor: pointer; font-weight: 600; }
  .fd-btn:hover { border-color: var(--accent); color: var(--accent); }
  .fd-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .fd-btn.primary:hover { background: var(--accent-dark); color: white; }

  .no-results { text-align: center; padding: 50px; color: var(--ink-soft); font-size: 13.5px; background: white; }
  .loading-row td { text-align: center; padding: 40px; color: var(--ink-soft); }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: white; border-radius: 10px; padding: 12px 18px; font-size: 12.5px; z-index: 999; opacity: 0; transition: opacity 0.3s, transform .3s; transform: translateY(6px); pointer-events: none; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .toast.show { opacity: 1; transform: translateY(0); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d6d8e0; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #b7b9c4; }
</style>
</head>
<body>
<div class="header">
  <div class="titlewrap">
    <div>
      <div class="logo-wordmark">CODER<span>HOUSE</span></div>
      <h1>Tablero de Comisiones</h1>
      <p>Comisiones por iniciar</p>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
    <button class="refresh-btn" id="refreshBtn" onclick="triggerRefresh()">&#8635; Actualizar datos</button>
    <div class="last-update" id="lastUpdate">Cargando...</div>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="controls">
  <input type="text" id="search" placeholder="Buscar por curso, comision, profesor..." oninput="applyFilters()">
  <span class="filter-label">Fecha Inicio</span>
  <input type="date" id="dateFrom" onchange="applyFilters()">
  <span style="color:#c9cad3;font-size:11px;">&rarr;</span>
  <input type="date" id="dateTo" onchange="applyFilters()">
  <button class="quickbtn active" id="qb-todos" onclick="setQuick('ALL')">Todos</button>
  <button class="quickbtn" id="qb-2profes" onclick="setQuick('2PROF')">Con 2 profesores</button>
  <button class="quickbtn" id="qb-1profe" onclick="setQuick('1PROF')">Con 1 profesor</button>
  <button class="quickbtn" id="qb-sinprofe" onclick="setQuick('NOPROF')">Sin profesor</button>
  <button class="clear-btn" onclick="clearFilters()">&#10005; Limpiar filtros</button>
  <span class="result-count" id="result-count"></span>
</div>

<div class="table-wrap">
  <table>
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="tbody"><tr class="loading-row"><td colspan="14"><span class="spinner"></span>Cargando comisiones desde el sistema de Coderhouse...</td></tr></tbody>
  </table>
  <div id="no-results" class="no-results" style="display:none">No hay comisiones con esos filtros.</div>
</div>
<div class="toast" id="toast"></div>

<script>
let DATA = [];
let hasLoadedOnce = false;

const COLUMNS = [
  {key:'commission', label:'N. Comision', filter:false},
  {key:'course', label:'Curso', filter:true},
  {key:'isB2B', label:'B2B', filter:true, fmt:v=>v?'SI':'NO'},
  {key:'profesor1', label:'Profesor', filter:true},
  {key:'profesor2', label:'Profesor 2', filter:true},
  {key:'startDateISO', label:'Fecha Inicio', filter:false},
  {key:'endDate', label:'Fecha Fin', filter:false},
  {key:'days', label:'Dias de Semana', filter:true},
  {key:'horaInicio', label:'Hora Inicio', filter:true},
  {key:'horaFin', label:'Hora Fin', filter:true},
  {key:'isSoldOut', label:'Sold Out', filter:true, fmt:v=>v?'SI':'NO'},
  {key:'students', label:'Estudiantes', filter:false},
  {key:'modalidad', label:'Modalidad', filter:true},
  {key:'pais', label:'Pais', filter:true},
];

let filters = {};
let quick = 'ALL';
let sortCol = 'startDateISO', sortDir = 1;
let openDropdownKey = null;

function showToast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms || 3500);
}

function loadData(){
  const b = document.getElementById('refreshBtn');
  b.textContent = 'Actualizando...'; b.disabled = true;
  if(hasLoadedOnce) showToast('Consultando el sistema de Coderhouse (puede tardar unos segundos)...', 15000);
  fetch('/api/dashboard-data')
    .then(r => r.json())
    .then(onDataLoaded)
    .catch(err => onLoadError({message: err && err.message ? err.message : String(err)}));
}

function onDataLoaded(payload){
  const b = document.getElementById('refreshBtn');
  b.textContent = '↻ Actualizar datos'; b.disabled = false;
  if(!payload || payload.error){
    onLoadError({message: (payload && payload.error) || 'Respuesta invalida del servidor'});
    return;
  }
  DATA = payload.rows || [];
  document.getElementById('lastUpdate').textContent = 'Ultima actualizacion: ' + payload.lastUpdate + ' hs (AR)';
  hasLoadedOnce = true;
  buildHeader();
  updateStats();
  applyFilters();
  showToast('Datos actualizados: ' + DATA.length + ' comisiones.', 3500);
}

function onLoadError(err){
  const b = document.getElementById('refreshBtn');
  b.textContent = '↻ Actualizar datos'; b.disabled = false;
  showToast('No se pudo actualizar: ' + (err && err.message ? err.message : err), 7000);
  if(!hasLoadedOnce){
    document.getElementById('tbody').innerHTML = '<tr class="loading-row"><td colspan="14">No se pudieron cargar los datos. Apreta "Actualizar datos" para reintentar.</td></tr>';
  }
}

function triggerRefresh(){ loadData(); }

function distinctValues(key, fmt){
  const set = new Set();
  DATA.forEach(r => set.add(fmt ? fmt(r[key]) : (r[key] === '' || r[key]==null ? '(vacio)' : String(r[key]))));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
}

function closeDropdown(){
  const el = document.getElementById('fd-dropdown');
  if(el) el.remove();
  openDropdownKey = null;
}

function openDropdown(col, anchorEl){
  if(openDropdownKey === col.key){ closeDropdown(); return; }
  closeDropdown();
  openDropdownKey = col.key;
  const values = distinctValues(col.key, col.fmt);
  const current = filters[col.key];

  const dd = document.createElement('div');
  dd.className = 'filter-dropdown';
  dd.id = 'fd-dropdown';
  const rect = anchorEl.getBoundingClientRect();
  const ddWidth = 240;
  let left = rect.left - 40;
  if(left + ddWidth > window.innerWidth - 10) left = window.innerWidth - ddWidth - 10;
  left = Math.max(4, left);
  let top = rect.bottom + 4;
  if(top + 320 > window.innerHeight - 10) top = Math.max(4, rect.top - 324);
  dd.style.top = top + 'px';
  dd.style.left = left + 'px';

  dd.innerHTML = `
    <div class="fd-search"><input type="text" placeholder="Buscar valor..." id="fd-search-input"></div>
    <div class="fd-actions"><a id="fd-all">Seleccionar todos</a><a id="fd-none">Limpiar</a></div>
    <div class="fd-list" id="fd-list"></div>
    <div class="fd-footer">
      <button class="fd-btn" id="fd-cancel">Cancelar</button>
      <button class="fd-btn primary" id="fd-apply">Aplicar</button>
    </div>`;
  document.body.appendChild(dd);

  let checkedSet = current ? new Set(current) : new Set(values);

  function renderList(filterText){
    const list = document.getElementById('fd-list');
    const ft = (filterText||'').toLowerCase();
    list.innerHTML = values.filter(v => v.toLowerCase().includes(ft)).map(v => {
      const id = 'fdchk-' + btoa(unescape(encodeURIComponent(v))).replace(/[^a-zA-Z0-9]/g,'');
      const checked = checkedSet.has(v) ? 'checked' : '';
      return `<label class="fd-item" for="${id}"><input type="checkbox" id="${id}" data-val="${encodeURIComponent(v)}" ${checked}> ${v}</label>`;
    }).join('');
    list.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const val = decodeURIComponent(cb.getAttribute('data-val'));
        if(cb.checked) checkedSet.add(val); else checkedSet.delete(val);
      });
    });
  }
  renderList('');

  document.getElementById('fd-search-input').addEventListener('input', e => renderList(e.target.value));
  document.getElementById('fd-all').onclick = () => { checkedSet = new Set(values); renderList(document.getElementById('fd-search-input').value); };
  document.getElementById('fd-none').onclick = () => { checkedSet = new Set(); renderList(document.getElementById('fd-search-input').value); };
  document.getElementById('fd-cancel').onclick = closeDropdown;
  document.getElementById('fd-apply').onclick = () => {
    if(checkedSet.size === values.length) delete filters[col.key];
    else filters[col.key] = checkedSet;
    closeDropdown();
    applyFilters();
  };

  setTimeout(() => {
    document.addEventListener('click', function handler(e){
      if(!dd.contains(e.target) && e.target !== anchorEl){
        closeDropdown();
        document.removeEventListener('click', handler);
      }
    });
  }, 0);
}

function buildHeader(){
  const tr = document.getElementById('headerRow');
  tr.innerHTML = COLUMNS.map(col => {
    const activeFilter = filters[col.key] ? 'active' : '';
    const filterIcon = col.filter ? `<span class="filter-icon ${activeFilter}" data-colkey="${col.key}" title="Filtrar">&#9660;</span>` : '';
    return `<th data-sortkey="${col.key}"><div class="th-inner"><span class="th-label" data-sortkey2="${col.key}">${col.label}</span>${filterIcon}</div></th>`;
  }).join('');

  tr.querySelectorAll('.th-label').forEach(el => {
    el.addEventListener('click', () => sortBy(el.getAttribute('data-sortkey2')));
  });
  tr.querySelectorAll('.filter-icon').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = el.getAttribute('data-colkey');
      const col = COLUMNS.find(c => c.key === key);
      openDropdown(col, el);
    });
  });
  updateSortIndicators();
}

function updateSortIndicators(){
  document.querySelectorAll('#headerRow th').forEach(th => {
    th.classList.remove('sorted-asc','sorted-desc');
    if(th.getAttribute('data-sortkey') === sortCol){
      th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
    }
  });
}

function sortBy(key){
  sortDir = (sortCol === key) ? -sortDir : 1;
  sortCol = key;
  updateSortIndicators();
  applyFilters();
}

function setQuick(val){
  quick = val;
  document.getElementById('qb-todos').classList.toggle('active', val==='ALL');
  document.getElementById('qb-2profes').classList.toggle('active', val==='2PROF');
  document.getElementById('qb-1profe').classList.toggle('active', val==='1PROF');
  document.getElementById('qb-sinprofe').classList.toggle('active', val==='NOPROF');
  applyFilters();
}

function clearFilters(){
  filters = {};
  quick = 'ALL';
  document.getElementById('search').value = '';
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  setQuick('ALL');
  buildHeader();
  applyFilters();
}

function passesColumnFilters(r){
  for(const col of COLUMNS){
    if(!col.filter) continue;
    const allowed = filters[col.key];
    if(!allowed) continue;
    const raw = r[col.key];
    const v = col.fmt ? col.fmt(raw) : (raw === '' || raw == null ? '(vacio)' : String(raw));
    if(!allowed.has(v)) return false;
  }
  return true;
}

function applyFilters(){
  if(!hasLoadedOnce) return;
  const q = document.getElementById('search').value.toLowerCase().trim();
  const df = document.getElementById('dateFrom').value;
  const dt = document.getElementById('dateTo').value;

  let rows = DATA.filter(r => {
    if(quick === '2PROF' && r.profCount < 2) return false;
    if(quick === '1PROF' && r.profCount !== 1) return false;
    if(quick === 'NOPROF' && r.profCount > 0) return false;
    if(!passesColumnFilters(r)) return false;
    if(df && r.startDateISO < df) return false;
    if(dt && r.startDateISO > dt) return false;
    if(q){
      const hay = (String(r.commission)+' '+r.course+' '+r.profesor1+' '+r.profesor2).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a,b) => {
    let va = a[sortCol], vb = b[sortCol];
    if(typeof va === 'boolean') va = va?1:0;
    if(typeof vb === 'boolean') vb = vb?1:0;
    if(typeof va === 'number' && typeof vb === 'number') return sortDir*(va-vb);
    va = String(va||'').toLowerCase(); vb = String(vb||'').toLowerCase();
    return sortDir*(va<vb?-1:va>vb?1:0);
  });

  document.getElementById('result-count').textContent = 'Mostrando ' + rows.length + ' de ' + DATA.length;

  const tbody = document.getElementById('tbody');
  if(!rows.length){
    tbody.innerHTML = '';
    document.getElementById('no-results').style.display = 'block';
    return;
  }
  document.getElementById('no-results').style.display = 'none';

  tbody.innerHTML = rows.map(r => {
    const pct = r.maxStudents > 0 ? r.students / r.maxStudents : 0;
    const bg = pct >= 0.85 ? 'var(--pink-bg)' : pct >= 0.5 ? 'var(--amber-bg)' : 'var(--green-bg)';
    const color = pct >= 0.85 ? 'var(--pink)' : pct >= 0.5 ? 'var(--amber)' : 'var(--green)';
    return '<tr>'
      + '<td class="commission">#' + r.commission + '</td>'
      + '<td class="course-name">' + r.course + '</td>'
      + '<td>' + (r.isB2B ? '<span class="badge tag-si">SI</span>' : '<span class="tag-no">NO</span>') + '</td>'
      + '<td>' + (r.profesor1 ? r.profesor1 : '<span class="prof-empty">Sin asignar</span>') + '</td>'
      + '<td>' + (r.profesor2 ? r.profesor2 : '<span class="prof-empty">Sin asignar</span>') + '</td>'
      + '<td>' + r.startDate + '</td>'
      + '<td>' + r.endDate + '</td>'
      + '<td>' + r.days + '</td>'
      + '<td>' + r.horaInicio + '</td>'
      + '<td>' + r.horaFin + '</td>'
      + '<td>' + (r.isSoldOut ? '<span class="badge tag-soldout-si">SI</span>' : '<span class="tag-soldout-no">NO</span>') + '</td>'
      + '<td><span class="estudiantes" style="background:' + bg + ';color:' + color + '">' + r.students + '</span></td>'
      + '<td><span class="modalidad-tag">' + r.modalidad + '</span></td>'
      + '<td class="pais-tag">' + r.pais + '</td>'
      + '</tr>';
  }).join('');
}

function updateStats(){
  const t = DATA.length;
  const con2 = DATA.filter(r => r.profCount >= 2).length;
  const con1 = DATA.filter(r => r.profCount === 1).length;
  const sin = DATA.filter(r => r.profCount === 0).length;
  const soldout = DATA.filter(r => r.isSoldOut).length;
  const b2b = DATA.filter(r => r.isB2B).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="num">' + t + '</div><div class="lbl">Total por iniciar</div></div>' +
    '<div class="stat-card green"><div class="num">' + con2 + '</div><div class="lbl">Con 2 profesores</div></div>' +
    '<div class="stat-card orange"><div class="num">' + con1 + '</div><div class="lbl">Con 1 profesor</div></div>' +
    '<div class="stat-card red"><div class="num">' + sin + '</div><div class="lbl">Sin profesor</div></div>' +
    '<div class="stat-card"><div class="num">' + soldout + '</div><div class="lbl">Sold out</div></div>' +
    '<div class="stat-card"><div class="num">' + b2b + '</div><div class="lbl">B2B</div></div>';
}

buildHeader();
loadData();
</script>
</body>
